<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Signing in…</title>
  <style>
    body { font: 16px system-ui, sans-serif; display: grid; place-items: center; min-height: 90vh; margin: 0; color: #1f2328; background: #fff; }
    @media (prefers-color-scheme: dark) { body { color: #e6e8eb; background: #1d2125; } }
  </style>
</head>
<body>
  <p id="msg">Signing in…</p>
  <script>
    // OAuth redirect target: store the result for the map page (same tab) and go back to it.
    (function () {
      var p = new URLSearchParams(location.search);
      var msg = { code: p.get('code'), state: p.get('state'), error: p.get('error') };
      var pending = null;
      try { pending = JSON.parse(sessionStorage.getItem('osm-oauth-pending')); } catch (e) {}
      if (!pending || pending.state !== msg.state) {
        // Login finished in a different tab/window: fall back to the copy in localStorage.
        var shared = null;
        try { shared = JSON.parse(localStorage.getItem('osm-oauth-pending')); } catch (e) {}
        if (shared) {
          pending = shared;
          try { sessionStorage.setItem('osm-oauth-pending', JSON.stringify(shared)); } catch (e) {}
        }
      }
      if (pending && pending.returnTo) {
        try { sessionStorage.setItem('osm-oauth-result', JSON.stringify(msg)); } catch (e) {}
        location.replace(pending.returnTo);
      } else {
        history.replaceState(null, '', location.pathname);
        document.getElementById('msg').innerHTML =
          'This login link has expired. <a href="./">Back to the map</a>, reload it (Cmd/Ctrl+Shift+R) and try again.';
      }
    })();
  </script>
</body>
</html>
