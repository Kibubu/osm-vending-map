name: Build data and deploy

# Nightly: filter the vending machines of the region out of a Geofabrik extract, cut them into tiles
# (scripts/build-tiles.mjs), keep the tiles on the `tiles` branch (one commit, force-pushed, so the
# repository doesn't grow) and deploy the site with them to GitHub Pages.
# On every push to main: deploy the site with the tiles from the last nightly run.
#
# Needs Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC, after Geofabrik's nightly Europe extract is out
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Rebuild the tiles from OSM (otherwise only deploy)'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # The smallest Geofabrik extract that contains the region (Hessen, ~350 MB), cropped to
  # REGION_BBOX (south,west,north,east; empty = keep the whole extract). Downloaded once a night,
  # so keep the extract small: all of Europe is ~35 GB.
  PBF_URL: https://download.geofabrik.de/europe/germany/hessen-latest.osm.pbf
  REGION_BBOX: '50.93,8.95,51.33,9.60'
  REGION_NAME: Fritzlar and surroundings

jobs:
  tiles:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rebuild)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USER_AGENT: 'osm-vending-map/1.0 (GitHub Action; +https://github.com/${{ github.repository }})'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      - name: Build tiles
        run: node scripts/build-tiles.mjs --pbf "$PBF_URL" --bbox "$REGION_BBOX" --region "$REGION_NAME" --out tiles

      - name: Push to the tiles branch
        run: |
          cd tiles
          git init -q -b tiles
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "tiles: $(jq -r '.count' index.json) machines, OSM data of $(jq -r '.timestamp_osm_base' index.json)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tiles

  deploy:
    needs: tiles
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          ref: tiles
          path: tiles

      - name: Assemble the site
        run: |
          rm -rf tiles/.git
          mkdir _site
          cp -r index.html land.html app.js i18n.js osm.js style.css sw.js vendor tiles _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
