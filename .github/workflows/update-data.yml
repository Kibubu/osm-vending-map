name: Update vending machine data

on:
  schedule:
    - cron: '17 2 * * *'   # nightly, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Region: south,west,north,east. Change here (and in scripts/fetch-data.mjs default) to move the map.
      REGION_BBOX: '50.93,8.95,51.33,9.60'
      REGION_NAME: 'Fritzlar and surroundings'
      USER_AGENT: 'osm-vending-map/1.0 (GitHub Action; +https://github.com/${{ github.repository }})'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch from Overpass
        run: npm run fetch

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- data/vending.geojson)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vending.geojson
          git commit -m "data: update vending machines ($(date -u +%Y-%m-%d))"
          git push
